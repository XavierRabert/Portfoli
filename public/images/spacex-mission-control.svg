<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Mission Control — Spaceflight dashboard</title>
  <desc id="desc">Illustració tècnica monocromàtica d'un coet preparat per al llançament, amb una composició editorial inspirada en l'estètica aeroespacial.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17191a"/><stop offset=".58" stop-color="#090a0b"/><stop offset="1" stop-color="#202326"/></linearGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#777d80"/><stop offset=".45" stop-color="#f1f1ed"/><stop offset="1" stop-color="#8c9294"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4f1e9" stop-opacity=".8"/><stop offset="1" stop-color="#777d80" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d9dddf" stroke-opacity=".075" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <g fill="none" stroke="#d9dddf" stroke-opacity=".26" stroke-width="1">
    <path d="M55 55h90M55 55v90M1145 55h-90M1145 55v90M55 645h90M55 645v-90"/>
    <path d="M55 585H1145" stroke-opacity=".12"/>
    <circle cx="900" cy="300" r="225" stroke-dasharray="2 10" stroke-opacity=".18"/>
    <circle cx="900" cy="300" r="190" stroke-opacity=".08"/>
  </g>
  <g fill="#e9eceb" opacity=".45">
    <circle cx="760" cy="106" r="2"/><circle cx="1080" cy="175" r="2"/><circle cx="1030" cy="520" r="1.5"/><circle cx="690" cy="440" r="1.5"/><circle cx="1120" cy="390" r="1"/>
  </g>
  <g transform="translate(875 330) rotate(8)">
    <path d="M-20 150C-35 225-20 260 0 300C20 260 35 225 20 150Z" fill="url(#flame)" opacity=".6"/>
    <path d="M-29 126L-38 190L-4 170L0 164L4 170L38 190L29 126Z" fill="#aeb4b6"/>
    <path d="M-31 125Q-30 -125 0 -210Q30 -125 31 125Z" fill="url(#rocket)" stroke="#f1f1ed" stroke-opacity=".7" stroke-width="2"/>
    <path d="M-21 -28H21M-25 30H25M-29 88H29" stroke="#33383b" stroke-width="5" opacity=".75"/>
    <path d="M-25 92H25V125H-25Z" fill="#454b4e"/>
    <path d="M-12 -135H12" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <path d="M0 -205V-170" stroke="#fff" stroke-opacity=".35"/>
    <path d="M-8 128L-12 170M8 128L12 170" stroke="#dfe2e0" stroke-opacity=".65" stroke-width="2"/>
  </g>
  <g fill="#f0f1ee" font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="104" font-size="14" letter-spacing="5" opacity=".62">INDEPENDENT ENGINEERING PROJECT</text>
    <text x="78" y="290" font-size="78" font-weight="700" letter-spacing="-3">MISSION</text>
    <text x="78" y="376" font-size="78" font-weight="700" letter-spacing="-3">CONTROL</text>
    <text x="82" y="425" font-size="18" letter-spacing="4" opacity=".72">SPACEFLIGHT TRACKING PLATFORM</text>
    <text x="82" y="595" font-size="13" letter-spacing="3" opacity=".48">LAUNCHES / VEHICLES / MISSIONS</text>
    <text x="1116" y="625" text-anchor="end" font-size="12" letter-spacing="3" opacity=".5">01 — 03</text>
  </g>
  <path d="M82 465H430" stroke="#f0f1ee" stroke-opacity=".35"/>
  <path d="M82 465H150" stroke="#f0f1ee" stroke-width="2"/>
</svg>