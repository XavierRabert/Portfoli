name: Validació Portfolio Personal
on:
  pull_request:
    branches: [devel, main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el codi
        uses: actions/checkout@v4

      - name: Instal·lar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instal·lar dependències
        run: pnpm install

      - name: Sincronitzar tipats d'Astro
        run: pnpm astro sync

      - name: TypeScript Check
        run: pnpm run typecheck

      - name: Astro Check (Linting)
        run: pnpm run check

      - name: Intent de Build (Vercel Ready)
        run: pnpm run build
